[project]
name = "astrbot-plugin-furrycons"
version = "0.2.13"
description = "FurryCons 展会图片查询 AstrBot 插件"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "playwright>=1.55,<2",
  "tzdata>=2025.2",
  "Pillow>=13,<14",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.13,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
