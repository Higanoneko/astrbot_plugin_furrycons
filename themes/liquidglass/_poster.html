<div class="poster-frame{% if not event.poster %} no-poster{% endif %}"{% if event.poster %} style="--poster-ratio:{{ event.poster.width }} / {{ event.poster.height }};{% if event.poster.edge_colors|default(false) %}--poster-edge-top:{{ event.poster.edge_colors.top }};--poster-edge-middle:{{ event.poster.edge_colors.middle }};--poster-edge-bottom:{{ event.poster.edge_colors.bottom }};{% endif %}"{% endif %}>{% if event.poster %}<img class="poster-image" src="{{ event.poster.url }}" alt="{{ event.name }}的展会海报" width="{{ event.poster.width }}" height="{{ event.poster.height }}"><div class="poster-soft-layer" aria-hidden="true"><img class="poster-blur" src="{{ event.poster.url }}" alt=""></div>{% else %}<div class="poster-placeholder"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="6" y="8" width="36" height="32" rx="8" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="19" r="3" fill="currentColor"/><path d="m9 35 11-10 8 7 7-8 6 10" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>{{ event.poster_note|default('暂无展会海报') }}</span><small>展会信息仍可正常查看</small></div>{% endif %}</div>
