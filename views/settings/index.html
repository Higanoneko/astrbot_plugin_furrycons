<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FurryCons 快速配置</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">FurryCons</p><h1>快速配置</h1>
      <p>配置展会查询与聊天交互。保存后，请回到插件管理页重载插件。</p>
    </header>
    <p id="status" role="status" aria-live="polite">正在连接 AstrBot…</p>
    <p id="error" role="alert" hidden></p>
    <form id="settings" hidden>
      <div id="groups"></div>
      <section><h2>管理能力</h2>
        <p>浏览器部署：页面管理开发中。当前可在插件配置填写浏览器路径，聊天输入“主入口 状态”检查运行环境。</p>
        <p>主题管理：页面管理开发中。当前可使用主题列表、默认、改色、导入及副本命令。</p>
        <p>主题商店计划于 P3 提供。</p>
      </section>
      <div class="actions"><button id="save" type="submit">保存配置</button><button id="refresh" type="button" class="secondary">重新读取</button></div>
      <p class="note">此页面使用已认证的 Dashboard 管理权限；聊天中的管理操作仍要求 AstrBot 机器人管理员，群主或频道管理员身份不会自动授权。</p>
    </form>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
